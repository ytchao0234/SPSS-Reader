name: Build SPSS Results Reader

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-2025
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # -------------------------
      # Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install Python dependencies
        run: pipenv sync

      # -------------------------
      # Node dependencies
      # -------------------------
      - name: Install Node dependencies
        run: npm ci

      # -------------------------
      # Build Python analyzer
      # -------------------------
      - name: Build Python analyzer - macOS
        if: runner.os == 'macOS'
        run: |
          pipenv run pyinstaller \
            electron/python/analyzer.py \
            --onedir \
            --name analyzer \
            --distpath python \
            --workpath build

      - name: Build Python analyzer - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pipenv run pyinstaller `
            electron/python/analyzer.py `
            --onedir `
            --name analyzer `
            --distpath python `
            --workpath build

      # -------------------------
      # Build Electron
      # -------------------------
      - name: Build Electron app
        run: npm run dist

      # -------------------------
      # Upload build artifact
      # -------------------------
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SPSS-Results-Reader-${{ matrix.name }}
          path: release/

      # -------------------------
      # Upload release files
      # -------------------------
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS release
        uses: actions/download-artifact@v4
        with:
          name: release-macOS
          path: release/macOS

      - name: Download Windows release
        uses: actions/download-artifact@v4
        with:
          name: release-Windows
          path: release/Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macOS/*.dmg
            release/Windows/*.exe
          generate_release_notes: true